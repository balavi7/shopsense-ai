name: Deploy ShopSense AI

on:
  push:
    branches:
      - main    # triggers on every push to main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout code ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup SSH

      - name: Configure SSH
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/shopsense.pem

          echo "Checking private key file..."
          ls -la ~/.ssh/shopsense.pem

          sudo chmod 600 ~/.ssh/shopsense.pem

          echo "Testing SSH port..."
          timeout 10 bash -c "</dev/tcp/${{ secrets.EC2_HOST }}/22"

          echo "Running ssh-keyscan..."
          ssh-keyscan -v -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

          echo "SSH setup completed"

      # ── 3. Copy files to EC2 ──────────────────────────────────────────────
      - name: Copy project files to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='chroma_store/' \
            --exclude='logs/' \
            --exclude='*.db' \
            --exclude='.env' \
            --exclude='infra/' \
            -e "ssh -i ~/.ssh/shopsense.pem" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/shopsense-ai/ 
