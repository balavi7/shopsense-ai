name: Deploy ShopSense AI

on:
  push:
    branches:
      - main    # triggers on every push to main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout code ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup SSH

      - name: Configure SSH
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/shopsense.pem

          chmod 600 ~/.ssh/shopsense.pem

          echo "Checking private key file permission..."
          ls -la ~/.ssh/shopsense.pem

          echo "Running ssh-keyscan.."
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

          echo "SSH setup completed"


      # ── 3. Copy files to EC2 ──────────────────────────────────────────────
      - name: Copy project files to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='chroma_store/' \
            --exclude='logs/' \
            --exclude='*.db' \
            --exclude='.env' \
            --exclude='infra/' \
            -e "ssh -i ~/.ssh/shopsense.pem" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/shopsense-ai/


      # ── 4. Deploy on EC2 ──────────────────────────────────────────────────
      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/shopsense.pem \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'

            set -e
            cd /home/ubuntu/shopsense-ai

            echo " Verifying the files..."
            ls

            echo "🔨 Building and starting containers..."
            docker compose up --build -d

            echo "⏳ Waiting for containers to be ready..."
            sleep 20

            echo "📋 Container status:"
            docker ps

            echo "🏥 Health check..."
            curl -sf http://localhost:8000/health && echo "✅ Backend is up" || echo "⚠️ Backend not ready yet"

          ENDSSH
