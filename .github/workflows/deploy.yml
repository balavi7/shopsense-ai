name: Deploy ShopSense AI

on:
  push:
    branches:
      - main    # triggers on every push to main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout code ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup SSH

      - name: Configure SSH
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/shopsense.pem

          echo "Checking private key file..."
          ls -la ~/.ssh/shopsense.pem

          chmod 600 ~/.ssh/shopsense.pem

          echo "Running ssh-keyscan..."
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

          echo "SSH setup completed"

