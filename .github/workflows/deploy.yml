name: Deploy ShopSense AI

on:
  push:
    branches:
      - main    # triggers on every push to main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout code ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. Setup SSH ──────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/home/ubuntu/.ssh/shopsense.pem
